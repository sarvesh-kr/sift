[package]
name = "sift-core"
version = "0.4.0"
edition = "2021"
description = "Local filesystem scanning and reviewed trash operations for Sift"
license = "MIT"

[dependencies]
base64 = "0.22"
jpeg-decoder = { version = "0.3", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "ico"] }
blake3 = "1.8"
file-id = "0.2"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
walkdir = "2.5"

[target.'cfg(not(windows))'.dependencies]
trash = "5.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }
windows-core = "0.62"

[target.'cfg(windows)'.dev-dependencies]
trash = "5.2"

[dev-dependencies]
tempfile = "3"
