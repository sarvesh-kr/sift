[package]
name = "sift"
version = "0.6.0"
description = "Your space, simplified. A local-first disk explorer."
authors = ["Sift"]
edition = "2021"
license = "MIT"

[lib]
name = "sift_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
sift-core = { path = "../native-core" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
