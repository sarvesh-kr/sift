name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'website-tests/**'
      - 'scripts/build-site.py'
      - 'scripts/test-site-builder.py'
      - 'playwright.website.config.ts'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  # Releases created with GITHUB_TOKEN do not emit another workflow event.
  # Refresh downloads after tagged builds have uploaded every asset.
  # Ordinary development builds do not change published downloads.
  workflow_run:
    workflows: ['Desktop builds', 'Android builds']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  refresh-from-main:
    # The Pages environment permits main. A release event runs in tag context,
    # so request the same tested workflow on main without relaxing that policy.
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Refresh release links from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"

  build:
    if: >-
      github.event_name != 'release' &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_repository.full_name == github.repository &&
         github.event.workflow_run.event == 'push' &&
         ((github.event.workflow_run.name == 'Desktop builds' && startsWith(github.event.workflow_run.head_branch, 'v')) ||
          (github.event.workflow_run.name == 'Android builds' && startsWith(github.event.workflow_run.head_branch, 'android-v')))))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Test release completeness safeguards
        run: python3 scripts/test-site-builder.py
      - name: Resolve complete release downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases" > "$RUNNER_TEMP/sift-releases.json"
          python3 scripts/build-site.py --releases "$RUNNER_TEMP/sift-releases.json"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check downloads, mobile layout, and keyboard interaction
        run: npx playwright test --config playwright.website.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: website-test-results
          path: test-results/
          retention-days: 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://sift.sarvesh.si
    steps:
      - name: Publish Sift website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the live HTTPS website
        run: |
          curl --fail --silent --show-error --retry 4 --retry-delay 5 https://sift.sarvesh.si/ \
            | python3 -c 'import sys; page=sys.stdin.read(); assert "<title>Sift — Your space, simplified.</title>" in page; assert "{{" not in page; print("Live HTTPS page verified.")'
