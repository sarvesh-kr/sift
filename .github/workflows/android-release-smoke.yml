name: Android release smoke
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful Android build run to verify
        required: true
        type: string
      source_commit:
        description: Expected full source commit in its build record
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  release-on-device:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Download and verify the release candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          python - <<'PY'
          import os,re,subprocess,json,hashlib
          from pathlib import Path
          assert re.fullmatch(r'\d+',os.environ['SOURCE_RUN'])
          assert re.fullmatch(r'[0-9a-f]{40}',os.environ['SOURCE_COMMIT'])
          subprocess.run(['gh','run','download',os.environ['SOURCE_RUN'],'--name','sift-android-package','--dir','candidate'],check=True)
          infos=list(Path('candidate').glob('*-build-info.json'));assert len(infos)==1
          info=json.loads(infos[0].read_text());assert info['commit']==os.environ['SOURCE_COMMIT']
          checks={n:d for d,n in (s.split('  ',1) for s in Path('candidate/SHA256SUMS-android.txt').read_text().splitlines())}
          for n,d in checks.items():
              assert Path(n).name==n
              assert hashlib.sha256(Path('candidate',n).read_bytes()).hexdigest()==d
          PY
          sdkmanager 'build-tools;35.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash scripts/smoke-android-release.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sift-android-release-device
          path: android-release-results/
