name: Quality checks
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'artifacts/**'
      - 'docs/**'
      - 'website/**'
      - 'website-tests/**'
      - 'android/**'
      - 'scripts/*android*'
      - 'scripts/build-site.py'
      - 'scripts/test-site-builder.py'
      - 'playwright.website.config.ts'
      - '.github/workflows/android*.yml'
      - '.github/workflows/pages.yml'
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    name: Interface and analysis tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: interface-test-results
          path: test-results/
          retention-days: 7
  core:
    name: Native safety checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-core -> target
      - run: cargo fmt --manifest-path native-core/Cargo.toml --check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path native-core/Cargo.toml --locked
      - run: cargo fmt --manifest-path recovery-engine/Cargo.toml --check
      - run: cargo test --manifest-path recovery-engine/Cargo.toml --locked
      - name: Recover permanently deleted files directly from a disposable NTFS drive
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-undelete.ps1
